[package]
name = "mod-advplus"
version = "1.0.1"
edition = "2021"
license = "MIT"
authors = ["Zekrenlight"]
publish = false
description = "Advancements+ for Sunrise: a clearer Advancements screen with a full tree, search and on-screen plaques (native mod)."

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command
# (the launcher builds against its own copy of the same build). The build it names is
# `[native] sunrise` in sunrise-mod.toml.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
