name = "Advancements+"
summary = "A full-window Advancements tree with search, filters, and on-screen plaques."
description = """
A full-window Advancements tree with search, filters, and on-screen plaques.

Advancements+ replaces the stock Advancements screen. Tabs show each root and its progress. The tree fills the card, laid out from parent links: chain-heavy tabs stay left to right, and wide tabs switch to a top-down tree. Drag to pan, and the mouse wheel steps zoom around the cursor. A list mode, search by title or id, and a filter that cycles All, Done, Active, and Locked are all there. Tooltips show the title, description, frame type, and remaining criteria.

Advancement toasts can be replaced with a short plaque at the top or bottom of the screen (icon, title, and a frame-type accent). Recipe plaques can be hidden, and plaques can be turned off so the game's own toasts remain. Open it from the pause menu, the Advancements key, or /advplus panel. It stays fully offline.
"""
authors = ["Zekrenlight"]
homepage = "https://github.com/Zekrenlight/advancements-plus"
issues = "https://github.com/Zekrenlight/advancements-plus/issues"
categories = ["utility"]

